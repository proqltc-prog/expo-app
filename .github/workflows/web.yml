name: Webversie

# Bouwt de app voor de browser en publiceert ze op GitHub Pages (WEEK-167).
# WEEK-195: enkel bij een release (door release.yml) of handmatig, om GitHub Actions te sparen.
# Dan bouwen en publiceren we de tag. Op pull requests en bij gewone merges draait deze workflow niet meer.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Afhankelijkheden installeren
        run: npm install --no-audit --no-fund

      - name: Webbuild maken
        run: npx expo export --platform web --output-dir dist

      - name: Bestanden voor GitHub Pages klaarzetten
        run: |
          # Zonder .nojekyll negeert GitHub Pages mappen die met een underscore beginnen.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist

  publiceer:
    if: github.event_name == 'workflow_dispatch'
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.uitrol.outputs.page_url }}
    steps:
      - id: uitrol
        uses: actions/deploy-pages@v4
