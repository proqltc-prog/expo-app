# Android-build met EAS (WEEK-37). Manueel starten: Actions › "Android-build" › Run workflow.
# Vereist het GitHub-secret EXPO_TOKEN (expo.dev › Account settings › Access tokens).
# - preview: APK om zelf op een gsm te installeren
# - production: AAB voor de Google Play Store (interne testtrack)
name: Android-build

on:
  workflow_dispatch:
    inputs:
      profiel:
        description: 'Build-profiel'
        type: choice
        options: [preview, production]
        default: preview

env:
  # Vastgepinde eas-cli-versie (WEEK-153). Bijwerken na een getest resultaat.
  EAS_CLI_VERSIE: '16'

jobs:
  build:
    # Vaste runner-versie: ubuntu-latest migreert naar Ubuntu 26 (WEEK-153).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Het GitHub-secret EXPO_TOKEN ontbreekt. Maak een token op expo.dev en voeg het toe onder Settings › Secrets › Actions."
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: EAS-project koppelen (eenmalig aangemaakt, daarna hergebruikt)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@${EAS_CLI_VERSIE} init --non-interactive --force
      - name: Build starten
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # eas-cli is vastgepind (niet @latest) zodat een nieuwe release de build niet meer breekt (WEEK-153).
          EAS="npx --yes eas-cli@${EAS_CLI_VERSIE}"
          if ! $EAS build --platform android --profile ${{ inputs.profiel }} --non-interactive --no-wait --json > build.json 2> build.fout; then
            # Eén regel, zodat de foutmelding zichtbaar is in de annotatie van de run.
            FOUT=$(cat build.fout build.json 2>/dev/null | tr '\n' ' ' | cut -c1-900)
            echo "::error::EAS-build kon niet worden gestart: $FOUT"
            exit 1
          fi
          ID=$(jq -r '.[0].id // empty' build.json)
          if [ -z "$ID" ]; then
            FOUT=$(tr '\n' ' ' < build.json | cut -c1-900)
            echo "::error::EAS gaf geen build-id terug: $FOUT"
            exit 1
          fi
          EIGENAAR=$($EAS whoami 2>/dev/null | head -1 | awk '{print $1}')
          echo "::notice::Build gestart: https://expo.dev/accounts/$EIGENAAR/projects/famenu/builds/$ID (klaar na 10–20 minuten; download daar de APK/AAB)"
