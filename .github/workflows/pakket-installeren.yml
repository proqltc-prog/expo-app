# Tijdelijk (WEEK-38): installeert react-native-google-mobile-ads op een branch via GitHub,
# zodat het niet op een eigen computer hoeft. Starten: Actions › "Pakket installeren (WEEK-38)" › Run workflow.
# Verwijderen zodra het pakket op de branch staat.
name: Pakket installeren (WEEK-38)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch waarop het pakket komt'
        required: true
        default: 'feature/WEEK-38-admob'

permissions:
  contents: write

jobs:
  installeer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx expo install react-native-google-mobile-ads
      - run: npm test
      - run: npm run typecheck:logica
      - name: Opslaan op de branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "WEEK-38: react-native-google-mobile-ads toegevoegd"
          git push origin HEAD:${{ inputs.branch }}
