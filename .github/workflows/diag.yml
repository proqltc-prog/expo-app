name: Diagnose
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: expo install --check
        run: npx expo install --check 2>&1 | tee check.txt || true
        env: { CI: '1' }
      - name: expo-doctor
        run: npx --yes expo-doctor@latest 2>&1 | tee doctor.txt || true
      - name: EAS-log
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest init --non-interactive --force || true
          npx --yes eas-cli@latest build:list --limit 1 --json --non-interactive > builds.json || true
          jq -r '.[0].logFiles[]?' builds.json > logs.txt || true
          echo "::notice::LOGFILES $(wc -l < logs.txt)"
          i=0; for u in $(cat logs.txt); do curl -sL --compressed "$u" -o log$i.txt; echo "::notice::TYPE $(file -b log$i.txt)"; i=$((i+1)); done
          for f in log*.txt; do zcat -f "$f"; echo; done > alles.txt 2>/dev/null || true
          echo "::notice::LOGGROOTTE $(wc -c < alles.txt)"
          # logregels zijn JSON (bunyan); haal de tekst eruit
          (jq -r 'select(.phase=="INSTALL_DEPENDENCIES") | .msg' alles.txt 2>/dev/null || cat alles.txt) | tail -60 | sed 's/^/::warning::LOG /' || true
      - name: Samenvatting
        if: always()
        run: |
          sed 's/^/::notice::CHECK /' check.txt | head -30
          grep -iE "✖|fail|mismatch|should|expected|issue" doctor.txt | sed 's/^/::warning::DOCTOR /' | head -30 || true
